cia es la etapa en la que el modelo aprende sus parámetros con los datos de entrenamiento». ¿Cuál es el error?","opts":["Ninguno, es correcta","Confunde inferencia con clasificación","Eso describe el entrenamiento; la inferencia aplica un modelo ya entrenado a casos nuevos","Confunde inferencia con etiqueta"],"ok":2,"why":"Entrenar es aprender patrones; inferir es aplicar lo aprendido a un caso nuevo."},{"id":"O03","room":0,"eje":2,"ficha":7,"term":"Clasificación","lv":"B","type":"DC","q":"Un banco quiere predecir cuánto dinero gastará un cliente el próximo mes. ¿Qué tarea supervisada corresponde?","opts":["Agrupamiento","Clasificación","Explicabilidad","Regresión"],"ok":3,"why":"El resultado es un valor numérico continuo, por eso es regresión; la clasificación devuelve categorías (fichas 07 y 08)."},{"id":"O04","room":0,"eje":7,"ficha":25,"term":"Probabilidad","lv":"B","type":"CA","q":"De 200 correos revisados, 50 son spam. Si se elige uno al azar, ¿cuál es la probabilidad de que sea spam?","opts":["0,25","0,50","4","0,75"],"ok":0,"why":"50 / 200 = 0,25. Una probabilidad siempre está entre 0 y 1, así que 4 no es posible."},{"id":"O05","room":1,"eje":3,"ficha":10,"term":"K-means","lv":"B","type":"DI","q":"«Divido los datos en K grupos: cada registro va al centro más cercano y recalculo los centros hasta que se estabilizan.» ¿Quién soy?","opts":["DBSCAN","KNN","Árbol de decisión","K-means"],"ok":3,"why":"K-means minimiza la distancia de cada muestra a su centroide."},{"id":"O06","room":1,"eje":3,"ficha":11,"term":"DBSCAN","lv":"I","type":"DI","q":"«No necesito saber de antemano cuántos grupos hay; encuentro regiones densas, admito formas irregulares y puedo marcar puntos como ruido.» ¿Quién soy?","opts":["K-means","PCA","DBSCAN","Regresión logística"],"ok":2,"why":"DBSCAN agrupa por densidad y no exige fijar el número de grupos."},{"id":"O07","room":1,"eje":2,"ficha":5,"term":"Aprendizaje supervisado","lv":"B","type":"DE","q":"Un compañero dice: «K-means es aprendizaje supervisado porque necesita conocer el grupo correcto de cada cliente». ¿Qué está mal?","opts":["K-means es de refuerzo","K-means es no supervisado: forma grupos sin conocer de antemano la etiqueta de grupo","Nada, es correcto","K-means solo sirve con texto"],"ok":1,"why":"Solo se fija K; no se entrega la respuesta correcta de cada registro (fichas 05 y 09)."},{"id":"O08","room":1,"eje":3,"ficha":9,"term":"Agrupamiento","lv":"B","type":"DC","q":"Una fábrica quiere agrupar máquinas por vibración, temperatura y consumo eléctrico, sin etiquetas previas. ¿Qué enfoque debe investigar primero?","opts":["Agrupamiento","Clasificación supervisada","Regresión","Aprendizaje por refuerzo"],"ok":0,"why":"Sin etiquetas se buscan grupos parecidos con un método no supervisado."},{"id":"O09","room":1,"eje":9,"ficha":35,"term":"Distancia euclidiana","lv":"B","type":"CA","q":"¿Cuál es la distancia euclidiana entre A(0, 0) y B(6, 8)?","opts":["14","10","100","48"],"ok":1,"why":"√(6² + 8²) = √100 = 10. Sumar 6 + 8 = 14 es un error común."},{"id":"O10","room":2,"eje":7,"ficha":26,"term":"Odds (razón a favor)","lv":"I","type":"CA","q":"La probabilidad de que un cliente cancele es 0,6. ¿Cuáles son las odds a favor de cancelar?","opts":["0,6","1,5","0,4","2,5"],"ok":1,"why":"odds = p / (1 − p) = 0,6 / 0,4 = 1,5, es decir 3:2."},{"id":"O11","room":2,"eje":7,"ficha":26,"term":"Odds (razón a favor)","lv":"I","type":"CA","q":"Las odds a favor de un evento son 4:1. ¿Cuál es su probabilidad?","opts":["0,8","0,25","0,4","4"],"ok":0,"why":"p = 4 / (4 + 1) = 0,8. Equivale a despejar p en odds = p / (1 − p)."},{"id":"O12","room":2,"eje":7,"ficha":28,"term":"Razón de momios (odds ratio)","lv":"A","type":"CA","q":"La probabilidad de cancelar es 0,50 en el grupo A y 0,20 en el grupo B. ¿Cuál es el odds ratio de A frente a B?","opts":["2,5","0,25","1,5","4"],"ok":3,"why":"Odds de A = 1; odds de B = 0,20 / 0,80 = 0,25; OR = 1 / 0,25 = 4. El 2,5 es el cociente de probabilidades, que no es el OR."},{"id":"O13","room":2,"eje":7,"ficha":26,"term":"Odds (razón a favor)","lv":"I","type":"DE","q":"Un analista dice: «Como el odds ratio de A frente a B es 2, la probabilidad de A es exactamente el doble que la de B». ¿Qué está mal?","opts":["Nada, es correcto","Un OR de 2 significa que la probabilidad de A es la mitad","Un OR compara odds, no probabilidades, y no prueba causalidad","El OR solo se usa en regresión lineal"],"ok":2,"why":"Odds dobles no implican probabilidad doble (fichas 26 y 28)."},{"id":"O14","room":2,"eje":7,"ficha":27,"term":"Log-odds (logit)","lv":"I","type":"DI","q":"«Soy el logaritmo natural de las odds. Convierto una probabilidad entre 0 y 1 en una escala que puede ser positiva o negativa, y con p = 0,5 valgo 0.» ¿Quién soy?","opts":["Odds ratio","Probabilidad","Log-odds (logit)","Función de pérdida"],"ok":2,"why":"logit(p) = ln[p / (1 − p)]; con p = 0,5 las odds son 1 y ln(1) = 0."},{"id":"O15","room":3,"eje":11,"ficha":44,"term":"Transformer","lv":"A","type":"DI","q":"«Me baso en mecanismos de atención para ponderar qué partes de una entrada importan, y proceso secuencias con mucho paralelismo.» ¿Quién soy?","opts":["Red recurrente (RNN)","Red convolucional (CNN)","Embedding","Transformer"],"ok":3,"why":"El transformer se apoya principalmente en la atención; la RNN procesa paso a paso con memoria interna."},{"id":"O16","room":3,"eje":8,"ficha":31,"term":"TF-IDF","lv":"I","type":"DE","q":"Un equipo dice: «TF-IDF da más peso a las palabras que aparecen en casi todos los documentos». ¿Qué está mal?","opts":["TF-IDF da menos peso a las palabras presentes en casi todos los documentos y más a las que ayudan a diferenciarlos","Nada, es correcto","TF-IDF es una técnica de aprendizaje por refuerzo","TF-IDF ignora la frecuencia de las palabras"],"ok":0,"why":"Combina la frecuencia del término en el documento con su rareza en el conjunto de documentos."},{"id":"O17","room":3,"eje":10,"ficha":40,"term":"Retropropagación","lv":"A","type":"DE","q":"Un estudiante dice: «La retropropagación es el paso que actualiza los pesos de la red». ¿Qué está mal?","opts":["Nada, es correcto","La retropropagación calcula los gradientes; un optimizador como el descenso de gradiente actualiza los pesos","La retropropagación solo se usa en K-means","La retropropagación elimina el sesgo neuronal"],"ok":1,"why":"Retropropagación aplica la regla de la cadena para obtener gradientes; el descenso de gradiente los usa para actualizar (fichas 16 y 40)."},{"id":"O18","room":3,"eje":4,"ficha":15,"term":"Convolución","lv":"I","type":"DC","q":"Una empresa quiere detectar rayones en fotografías de productos. ¿Qué arquitectura conviene y por qué?","opts":["RNN, porque procesa fotografías como una secuencia en el tiempo","Regresión logística sobre el nombre del archivo","CNN, porque sus filtros compartidos detectan patrones locales en cualquier posición","Un árbol de decisión sobre el precio del producto"],"ok":2,"why":"La convolución recorre la imagen con el mismo filtro, útil para patrones que aparecen en distintas posiciones (fichas 15 y 42)."},{"id":"O19","room":3,"eje":10,"ficha":37,"term":"Neurona artificial","lv":"A","type":"CA","q":"Una neurona recibe x1 = 2 y x2 = 3, con pesos w1 = 0,5 y w2 = −1 y sesgo b = 1. Con activación ReLU (devuelve el mayor valor entre 0 y z), ¿cuál es su salida?","opts":["−1","0","1","−2"],"ok":1,"why":"z = 2 × 0,5 + 3 × (−1) + 1 = −1; ReLU(−1) = 0. El −1 olvida la activación y el −2 olvida el sesgo."},{"id":"O20","room":4,"eje":13,"ficha":52,"term":"Generación aumentada por recuperación (RAG)","lv":"A","type":"DI","q":"«Primero recupero fragmentos relevantes de fuentes externas y luego los incorporo al contexto de un modelo generativo; no reentreno el modelo.» ¿Quién soy?","opts":["Ajuste fino","RAG","Prompt","Embedding"],"ok":1,"why":"RAG es generación aumentada por recuperación: consulta documentos y después responde."},{"id":"O21","room":4,"eje":13,"ficha":56,"term":"Ajuste fino","lv":"A","type":"DE","q":"Un equipo dice: «El ajuste fino y RAG hacen lo mismo: los dos modifican los pesos del modelo». ¿Qué está mal?","opts":["Nada, es correcto","Solo RAG modifica los pesos","El ajuste fino actualiza parámetros con entrenamiento adicional; RAG recupera contexto externo sin cambiar los pesos","Ninguno de los dos modifica los pesos"],"ok":2,"why":"El ajuste fino cambia el comportamiento aprendido; RAG solo aporta contexto al responder."},{"id":"O22","room":4,"eje":12,"ficha":45,"term":"Sesgo algorítmico","lv":"I","type":"DC","q":"Un modelo acierta el 90 % en promedio, pero falla mucho más con un subgrupo de usuarios. ¿Qué haces primero?","opts":["Publicarlo porque el promedio es alto","Quitar la columna del subgrupo y dar el problema por resuelto","Medir el desempeño por subgrupo y revisar datos, diseño y contexto de uso","Entrenar más épocas sin revisar nada"],"ok":2,"why":"El sesgo puede estar en los datos, el diseño o el uso; un buen promedio puede ocultarlo, y quitar una columna no garantiza eliminarlo."},{"id":"O23","room":4,"eje":12,"ficha":47,"term":"Privacidad de datos","lv":"A","type":"DC","q":"Un hospital quiere que un LLM responda preguntas del personal usando documentos de pacientes. ¿Qué decisión es más responsable?","opts":["Subir los historiales sin anonimizar para mejorar las respuestas","Dejar que el modelo decida tratamientos sin revisión","Prohibir la revisión humana para ganar velocidad","Usar RAG con documentos autorizados y anonimizados, registrar errores y exigir validación humana antes de actuar"],"ok":3,"why":"Combina privacidad de datos, supervisión humana y un modelo apoyado en fuentes controladas."},{"id":"O24","room":4,"eje":13,"ficha":57,"term":"Alucinación de IA","lv":"A","type":"DC","q":"Un chatbot de un curso inventa una referencia bibliográfica que parece real. ¿Cuál es la mejor medida?","opts":["Verificar la referencia en la fuente original, apoyar el chatbot en documentos controlados (RAG) y mantener supervisión humana","Confiar porque el texto es fluido","Pedirle al chatbot que confirme que su referencia es real","Borrar el historial de la conversación"],"ok":0,"why":"Una alucinación es una afirmación inventada presentada como fiable; un texto fluido no garantiza verdad."},{"id":"C01","room":0,"eje":6,"ficha":21,"term":"Regresión logística","lv":"A","type":"DC","q":"Una empresa quiere predecir si un pedido será devuelto (sí/no). ¿Qué combinación describe mejor el problema?","opts":["Regresión lineal sin variable objetivo","Clasificación supervisada con ejemplos etiquetados","Agrupamiento sin etiquetas","PCA para obtener la clase correcta"],"ok":1,"why":"La salida es una categoría y se dispone de etiquetas: clasificación supervisada."},{"id":"C02","room":0,"eje":6,"ficha":23,"term":"Bosque aleatorio","lv":"A","type":"DC","q":"Para decidir entre un árbol individual y un bosque aleatorio, el equipo prioriza reducir la varianza de las predicciones. ¿Cuál es la elección mejor justificada?","opts":["Un bosque aleatorio, que agrega numerosos árboles","Un árbol único siempre reduce más la varianza","Un SVM que nunca debe ajustarse","K-means porque combina árboles"],"ok":0,"why":"El bosque aleatorio combina árboles para estabilizar predicciones y frecuentemente reducir varianza."},{"id":"C03","room":0,"eje":2,"ficha":7,"term":"Clasificación","lv":"A","type":"DE","q":"Un análisis presenta «predecir 250 kWh» como un problema de clasificación. ¿Qué corrección procede?","opts":["Es regresión porque se predice una magnitud continua","Es clasificación porque 250 es entero","Es agrupamiento porque no hay clases","Es refuerzo porque estima consumos"],"ok":0,"why":"Predecir un valor de consumo es regresión, aunque pueda expresarse como un número entero."},{"id":"C04","room":0,"eje":1,"ficha":4,"term":"Inferencia","lv":"A","type":"DE","q":"Se obtiene una predicción con el modelo ya ajustado para un nuevo paciente. Un informe llama a este paso entrenamiento. ¿Cómo se corrige?","opts":["Es una validación de hiperparámetros","Es inferencia y no actualización de parámetros","Es generación de etiquetas observadas","Es necesariamente clustering"],"ok":1,"why":"Se aplica un modelo entrenado a un nuevo ejemplo; eso es inferencia."},{"id":"C05","room":0,"eje":6,"ficha":21,"term":"Regresión logística","lv":"A","type":"DC","q":"Una clínica predice la probabilidad de que un paciente acuda a una cita (sí/no). ¿Qué modelo de partida encaja especialmente bien con una salida probabilística binaria?","opts":["PCA","K-means","Regresión logística","DBSCAN"],"ok":2,"why":"La regresión logística modela una probabilidad de clase binaria usando la función sigmoide."},{"id":"C06","room":1,"eje":3,"ficha":11,"term":"DBSCAN","lv":"A","type":"DC","q":"Un mapa GPS contiene grupos con formas alargadas y ubicaciones aisladas que deben tratarse como ruido. ¿Qué método sería la primera opción razonable?","opts":["K-means obligando a 20 grupos","DBSCAN con parámetros de vecindad apropiados","Regresión logística con salidas numéricas","Un árbol de clasificación sin etiquetas"],"ok":1,"why":"DBSCAN permite formas arbitrarias y marca observaciones como ruido según densidad."},{"id":"C07","room":1,"eje":9,"ficha":36,"term":"Escalado de características","lv":"A","type":"DE","q":"Dos variables de KNN tienen escalas muy diferentes: edad entre 18 y 80, ingreso entre 0 y 100 000. ¿Qué riesgo hay al medir distancia sin preprocesar?","opts":["Los vecinos siempre mejoran","La variable de mayor escala puede dominar la distancia","KNN deja de necesitar K","Se convierte en un modelo de refuerzo"],"ok":1,"why":"La distancia se ve dominada por magnitudes numéricas grandes si no se ajustan escalas."},{"id":"C08","room":1,"eje":9,"ficha":34,"term":"Número de vecinos K","lv":"A","type":"DC","q":"En KNN con K=1 se observan predicciones muy sensibles a ruido. ¿Qué acción es razonable evaluar mediante validación?","opts":["Aumentar K y medir su efecto","Fijar K=0","Eliminar todas las variables","Sustituir todas las distancias por odds"],"ok":0,"why":"Un K mayor puede suavizar el efecto de observaciones ruidosas; debe validarse."},{"id":"C09","room":1,"eje":3,"ficha":12,"term":"Análisis de componentes principales (PCA)","lv":"A","type":"DE","q":"Un equipo asegura: «Si PCA retiene el 90 % de la varianza, necesariamente retiene el 90 % de la capacidad predictiva». ¿Qué ocurre?","opts":["Es una equivalencia matemática universal","PCA conserva variabilidad, no garantiza conservar información predictiva","PCA solo sirve para clases","PCA siempre aumenta la dimensionalidad"],"ok":1,"why":"Varianza explicada y capacidad predictiva son criterios diferentes."},{"id":"C10","room":1,"eje":5,"ficha":19,"term":"Política","lv":"A","type":"DC","q":"Un robot elige la siguiente acción según su estado para maximizar recompensa futura. ¿Qué componente define la regla de decisión?","opts":["La política del agente","El conjunto de prueba","La distancia euclidiana","El tokenizador"],"ok":0,"why":"La política asigna acciones según estados u observaciones."},{"id":"C11","room":2,"eje":7,"ficha":28,"term":"Razón de momios (odds ratio)","lv":"A","type":"CA","q":"Si P(A)=0,75 y P(B)=0,50, ¿cuál es el odds ratio A/B?","opts":["1,5","3","0,5","2"],"ok":1,"why":"Odds A=0,75/0,25=3; odds B=1; OR=3."},{"id":"C12","room":2,"eje":7,"ficha":26,"term":"Odds (razón a favor)","lv":"A","type":"CA","q":"Un evento tiene odds de 1:3 a favor. ¿Cuál es su probabilidad?","opts":["0,75","0,33","0,25","3"],"ok":2,"why":"Si odds=1/3, p=1/(1+3)=0,25."},{"id":"C13","room":2,"eje":8,"ficha":31,"term":"TF-IDF","lv":"A","type":"DE","q":"Un buscador considera más importante la palabra «de» que un término técnico raro porque aparece en todas las páginas. ¿Cuál es la objeción basada en TF-IDF?","opts":["La frecuencia general puede disminuir su capacidad de discriminar documentos","TF-IDF siempre aumenta peso a palabras universales","TF-IDF no utiliza textos","Toda palabra rara debe eliminarse"],"ok":0,"why":"La frecuencia inversa documental penaliza términos demasiado frecuentes en todos los documentos."},{"id":"C14","room":2,"eje":8,"ficha":32,"term":"Embedding","lv":"A","type":"DC","q":"Dos consultas no comparten palabras exactas, pero expresan ideas similares. ¿Qué representación puede capturar mejor esa semejanza semántica?","opts":["Recuento literal sin contexto","Un embedding entrenado para relaciones semánticas","La posición física de los archivos","El valor de K de K-means"],"ok":1,"why":"Los embeddings pueden situar expresiones semánticamente cercanas en zonas próximas del espacio vectorial."},{"id":"C15","room":2,"eje":10,"ficha":37,"term":"Neurona artificial","lv":"A","type":"CA","q":"Una neurona lineal calcula z=2×0,5+(-1)×3+2. Si usa ReLU, ¿cuál es su salida?","opts":["0","1","-1","6"],"ok":0,"why":"z=1−3+2=0 y ReLU(0)=0."},{"id":"C16","room":3,"eje":11,"ficha":44,"term":"Transformer","lv":"A","type":"DC","q":"Un sistema debe relacionar palabras muy separadas dentro de un documento largo. ¿Qué mecanismo es característico de un transformer?","opts":["Atención que pondera relaciones entre posiciones","Únicamente filtros espaciales 3×3","Solo transiciones de estados ocultos de una RNN","Una regla fija sin aprendizaje"],"ok":0,"why":"La atención permite modelar dependencias entre posiciones sin limitarse a procesamiento recurrente."},{"id":"C17","room":3,"eje":10,"ficha":40,"term":"Retropropagación","lv":"A","type":"DE","q":"Un estudiante dice que retropropagación y descenso de gradiente son exactamente el mismo proceso. ¿Cuál es la corrección?","opts":["La primera calcula gradientes y el segundo los utiliza para actualizar parámetros","Ambos solo hacen inferencia","El descenso de gradiente calcula tokens","La retropropagación solo vale para redes convolucionales"],"ok":0,"why":"Backprop propaga derivadas; optimizadores como SGD usan las derivadas para ajustar pesos."},{"id":"C18","room":3,"eje":11,"ficha":42,"term":"Red neuronal convolucional (CNN)","lv":"A","type":"DC","q":"Se deben inspeccionar defectos locales en imágenes de piezas industriales. ¿Qué arquitectura ofrece un sesgo inductivo útil para patrones espaciales?","opts":["CNN","RNN para textos","KNN sin distancias","Una política de refuerzo sin entorno"],"ok":0,"why":"Las CNN reutilizan filtros espaciales y extraen patrones locales."},{"id":"C19","room":3,"eje":12,"ficha":45,"term":"Sesgo algorítmico","lv":"A","type":"DC","q":"Un modelo de selección funciona bien en promedio pero rechaza de forma desproporcionada a un subgrupo. ¿Qué práctica es más responsable antes de desplegarlo?","opts":["Auditar desempeño por grupos y estudiar causas","Borrar la variable sensible y asumir que desapareció todo sesgo","No medir diferencias para evitar conflictos","Evaluarlo únicamente con exactitud promedio"],"ok":0,"why":"La evaluación desagregada y el análisis contextual son necesarios para descubrir sesgos."},{"id":"C20","room":3,"eje":12,"ficha":47,"term":"Privacidad de datos","lv":"A","type":"DC","q":"Un centro educativo desea entrenar una herramienta con expedientes sensibles. ¿Qué decisión reduce riesgos?","opts":["Incluir todos los identificadores sin control","Minimizar datos, establecer permisos y evaluar base legal","Publicar datos en repositorios abiertos","Quitar auditorías y registros"],"ok":1,"why":"La privacidad exige minimización, controles de acceso y tratamiento adecuado de datos."},{"id":"C21","room":4,"eje":13,"ficha":52,"term":"Generación aumentada por recuperación (RAG)","lv":"A","type":"DC","q":"Un reglamento de una empresa cambia cada semana. El sistema debe citar las versiones vigentes al responder. ¿Qué alternativa suele ser adecuada?","opts":["Ajuste fino del mismo documento cada minuto","RAG con recuperación de documentos autorizados y actualizados","Eliminar referencias documentales","Usar un prompt fijo sin fuentes"],"ok":1,"why":"RAG recupera información externa actualizada y puede acompañar las respuestas con fuentes verificables."},{"id":"C22","room":4,"eje":13,"ficha":58,"term":"Base de datos vectorial","lv":"A","type":"DC","q":"Un repositorio almacena vectores de textos y debe recuperar los fragmentos más parecidos a una pregunta. ¿Qué componente es clave?","opts":["Una base de datos vectorial","Un optimizador de gradientes","Una etiqueta binaria","Una recompensa"],"ok":0,"why":"La búsqueda vectorial recupera representaciones similares para aportar contexto."},{"id":"C23","room":4,"eje":13,"ficha":57,"term":"Alucinación de IA","lv":"A","type":"DE","q":"Un asistente genera citas bibliográficas inexistentes con tono convincente. ¿Qué evaluación es correcta?","opts":["Si parece formal, se puede publicar","Es posible alucinación: verificar contra las fuentes originales","El tamaño del modelo garantiza exactitud","Solo ocurre en modelos supervisados"],"ok":1,"why":"Los modelos generativos pueden producir referencias plausibles pero no reales; hay que corroborarlas."},{"id":"C24","room":4,"eje":13,"ficha":53,"term":"Agente de IA","lv":"A","type":"DE","q":"Alguien afirma que un agente de IA y un agente de aprendizaje por refuerzo son siempre el mismo objeto. ¿Qué distinción es apropiada?","opts":["Un agente de IA puede orquestar herramientas; uno de refuerzo aprende políticas mediante recompensas","Ambos son exclusivamente bases de datos","Un agente de refuerzo solo puede generar imágenes","Un agente de IA necesariamente modifica sus pesos en cada acción"],"ok":0,"why":"Son conceptos relacionados pero no equivalentes: cambian el mecanismo y la tarea."},{"id":"C25","room":4,"eje":13,"ficha":60,"term":"Gobernanza de IA","lv":"A","type":"DC","q":"Una empresa despliega modelos en decisiones sensibles. ¿Qué medida representa gobernanza de IA?","opts":["Designar responsables, monitorear riesgos y registrar evaluaciones","Permitir modelos sin responsables identificables","Eliminar toda supervisión humana","Tomar la velocidad como único indicador"],"ok":0,"why":"La gobernanza articula políticas, responsabilidad, controles y seguimiento durante el ciclo de vida."}];

function saveData(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));return true}catch{return false}}
function shuffled(src){const a=[...src];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selected(btn){const group=btn.parentElement;for(const el of group.querySelectorAll('button[data-choice]'))el.setAttribute('aria-pressed',String(el===btn));}
function persisted(){const d=loadData();return Array.isArray(d.history)?d.history:[]}
function selectQuestions(room,lv,n,usedSet,recent){
 const pool=shuffled(BANK.filter(q=>q.room===room&&q.lv===lv&&!usedSet.has(q.id)));
 const chosen=[];
 for(let i=0;i<n;i++){
  const remaining=pool.filter(q=>!chosen.includes(q));
  if(!remaining.length)throw Error('No hay suficientes retos en el banco para configurar esta sala.');
  const counts=Object.fromEntries(Object.keys(TYPES).map(t=>[t,chosen.filter(x=>x.type===t).length]));
  remaining.sort((a,b)=>{
   const ra=recent.includes(a.id)?1:0, rb=recent.includes(b.id)?1:0;
   if(ra!==rb)return ra-rb;
   if(counts[a.type]!==counts[b.type])return counts[a.type]-counts[b.type];
   return 0;
  });
  chosen.push(remaining[0]);
 }
 return shuffled(chosen.map(q=>{
  const opts=shuffled(q.opts.map((txt,i)=>({txt,original:i})));
  return {...q,options:opts.map(x=>x.txt),correct:opts.findIndex(x=>x.original===q.ok)+1};
 }));
}
function chooseRoute(mode){
 if(mode==='long')return [0,1,2,3,4];
 if(mode==='medium')return [0,shuffled([1,2,3])[0],4];
 return [shuffled([0,1,2,3])[0],4];
}
function modeLevels(level,n){if(level!=='P')return Array(n).fill(level);if(n===2)return ['B','A'];if(n===3)return ['B','I','A'];return ['B','B','I','A','A']}
function getScore(){
 if(!state)return {};
 const unlocked=state.completed.length*10;
 const correct=state.completed.reduce((sum,r)=>sum+r.questions.length*2,0);
 const hints=Object.keys(state.hints).length;
 const wrong=Object.values(state.fails).reduce((a,v)=>a+v,0);
 const penalty=Object.values(state.fails).reduce((a,v)=>a+Math.max(0,v-2),0);
 const bonus=state.result==='won'?Math.floor(state.secondsLeft/60):0;
 return {unlocked,correct,hints,wrong,penalty,bonus,total:unlocked+correct-hints*2-penalty+bonus,explained:Object.values(state.explained).filter(Boolean).length};
}
function summaryText(){const s=getScore();return [`CÓDIGO IA · ESCAPE DEL LABORATORIO`,`Equipo: ${state.team} · ${state.players} participante(s)`,`Modo: ${MODES[state.mode].label} · Nivel: ${LEVELS[state.level]}`,`Resultado: ${state.result==='won'?'Escape conseguido':'Tiempo agotado'}`,`Salas abiertas: ${state.completed.length} de ${state.route.length}`,`Retos resueltos: ${state.completed.reduce((a,r)=>a+r.questions.length,0)} de ${state.route.length*MODES[state.mode].per}`,`Tiempo usado: ${fmt(state.total-state.secondsLeft)} de ${fmt(state.total)}`,`Intentos fallidos: ${s.wrong} · Pistas: ${s.hints}`,`Explicaciones justificadas: ${s.explained}`,`Puntaje final: ${s.total}`,`ID de partida: ${state.session}`].join('\n')}
function playTick(){if(!state||state.phase==='end'||state.result==='won'||state.result==='timeout')return;state.secondsLeft=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));const clock=$('timer');if(clock){clock.textContent=fmt(state.secondsLeft);clock.classList.toggle('alert',state.secondsLeft<=180)}if(state.secondsLeft<=0){state.result='timeout';state.phase='end';clearInterval(timer);finishGame();render()}}
function startTick(){clearInterval(timer);timer=setInterval(playTick,250);playTick()}
function newGame(){
 const mode=MODES[prefs.mode],route=chooseRoute(prefs.mode),lvs=modeLevels(prefs.level,route.length),recent=persisted().slice(-3).flatMap(g=>g.ids||[]);
 const usedSet=new Set();let previous=[];
 const rooms=route.map((i,j)=>{const quests=selectQuestions(i,lvs[j],mode.per,usedSet,recent);quests.forEach(x=>usedSet.add(x.id));previous.push(...quests.map(x=>x.id));return {...ROOMS[i],index:i,lv:lvs[j],questions:quests}});
 const now=Date.now();state={mode:prefs.mode,level:prefs.level,team:prefs.team.trim().slice(0,50)||'Equipo Explorador',players:+prefs.players||1,route:rooms,roomPos:0,qPos:0,phase:'room',answers:{},fails:{},hints:{},explained:{},completed:[],result:null,secondsLeft:mode.minutes*60,total:mode.minutes*60,deadline:now+mode.minutes*60000,session:String(now).slice(-8),shownMessage:'',messageKind:'',hintShown:false,registered:false};
 const d=loadData();d.history=[...(Array.isArray(d.history)?d.history:[]),{date:now,ids:previous}].slice(-25);saveData(d);
 startTick();render();
}

function roomView(){const room=currentRoom(), q=room.questions[state.qPos],sel=state.answers[q.id]||0,done=answeredCount(room);return `${hud()}<section class="game-intro"><div><p class="eyebrow">SECTOR ${String(state.roomPos+1).padStart(2,'0')} / ${String(state.route.length).padStart(2,'0')} · ${esc(LEVELS[room.lv])}</p><h1>${esc(room.emoji)} ${esc(room.name)}</h1><p>${esc(room.mood)}</p></div><span class="checkpoint">${done} / ${room.questions.length} RESPUESTAS</span></section><div class="play-grid"><div><section class="panel question-panel"><div class="q-meta"><span class="chip">DESAFÍO ${String(state.qPos+1).padStart(2,'0')}</span><span class="chip level-${room.lv}">${LEVELS[q.lv]}</span><span class="chip">${TYPES[q.type]}</span></div><div class="progress-track"><div class="progress-fill" style="width:${100*done/room.questions.length}%"></div></div><p class="eyebrow">${esc(EJE_NAMES[q.eje-1])} · Ficha ${String(q.ficha).padStart(2,'0')}</p><h2>${esc(q.q)}</h2><div class="question-options" role="group" aria-label="Respuestas de la pregunta">${q.options.map((o,i)=>`<button class="answer" data-act="answer" data-q="${esc(q.id)}" data-n="${i+1}" aria-pressed="${sel===i+1}"><span class="answer-n">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="qfooter"><div class="qfootleft"><button class="ghost" data-act="prev" ${state.qPos===0?'disabled':''}>← Anterior</button><span class="short-note">Turno de lectura: jugador ${(state.qPos%state.players)+1}</span></div><button class="primary" data-act="nextq" ${state.qPos===room.questions.length-1?'disabled':''}>Siguiente →</button></div>${state.hintShown?`<p class="hintnote">💡 Pista: consulta la <b>ficha ${String(q.ficha).padStart(2,'0')}</b> del glosario y compara las cuatro opciones; no te guíes solo por palabras similares.</p>`:''}</section></div>
<aside class="panel terminal"><h3>⌘ &nbsp; Terminal de acceso</h3><p class="help">Selecciona una opción en cada reto. Los números elegidos forman la clave de esta puerta.</p><span class="eyebrow">CÓDIGO EN CONSTRUCCIÓN</span><div class="digitrow">${room.questions.map(x=>`<span class="digit ${state.answers[x.id]?'filled':''}">${state.answers[x.id]||'·'}</span>`).join('')}</div><button class="primary unlock" data-act="unlock" ${done!==room.questions.length?'disabled':''}>${done!==room.questions.length?'Completa los retos':'DESBLOQUEAR SALA →'}</button><p class="notice ${state.messageKind}" role="status" aria-live="polite">${esc(state.shownMessage||(done===room.questions.length?'Código listo para validar.':'Faltan '+(room.questions.length-done)+' decisiones.'))}</p><p class="short-note" style="margin-top:20px">Cambiar de pregunta</p><nav class="q-nav" aria-label="Navegar preguntas">${room.questions.map((x,i)=>`<button class="q-square ${state.answers[x.id]?'answered':''} ${state.qPos===i?'current':''}" data-act="jump" data-i="${i}" aria-label="Ir a pregunta ${i+1}">${i+1}</button>`).join('')}</nav><button class="ghost hint-btn" data-act="hint" ${state.hints[room.index]?'disabled':''}>${state.hints[room.index]?'✓ Pista utilizada':'✦ Solicitar pista (−2 puntos)'}</button><div class="minor-info"><div class="infobox"><small>Errores de código</small><strong>${state.fails[room.index]||0}</strong></div><div class="infobox"><small>Progreso</small><strong>${Math.round(done*100/room.questions.length)}%</strong></div></div><p class="footnote">Las respuestas correctas y sus explicaciones se muestran después de abrir esta sala.</p></aside></div>`}
function reviewView(){const r=currentRoom();const last=state.roomPos===state.route.length-1;return `${hud()}<section class="game-intro"><div><p class="eyebrow">ACCESO CONCEDIDO · SALA ${state.roomPos+1}</p><h1>🔓 Puerta desbloqueada</h1><p>Lo lograron. Ahora expliquen por qué esas respuestas eran correctas y revisen las ideas clave antes de avanzar.</p></div><span class="checkpoint">+${10+r.questions.length*2} PUNTOS</span></section><div class="review-grid">${r.questions.map((q,i)=>`<article class="panel review-card"><div class="q-meta"><span class="chip">RETO ${i+1}</span><span class="chip">${TYPES[q.type]}</span><span class="chip">FICHA ${q.ficha}</span></div><h3>${esc(q.q)}</h3><div class="answer-good">✓ ${q.correct}. ${esc(q.options[q.correct-1])}</div><p>${esc(q.why)}</p><label class="mark"><input type="checkbox" data-act="justify" data-id="${esc(q.id)}" ${state.explained[q.id]?'checked':''}> El equipo explicó el razonamiento con sus palabras (autoevaluación; no modifica puntos).</label></article>`).join('')}</div><div class="review-actions"><button class="primary" data-act="advance">${last?'VER RESULTADO FINAL →':'ENTRAR EN LA SIGUIENTE SALA →'}</button></div>`}
function ranking(){const d=loadData(),all=Array.isArray(d.results)?d.results:[];const a=all.filter(r=>r.mode===state.mode&&r.level===state.level).sort((a,b)=>b.score-a.score||a.used-b.used||a.hints-b.hints||a.errors-b.errors).slice(0,5);return a.length?a.map((r,i)=>`<div class="leader-row"><span>${i+1}.</span><strong>${esc(r.team)}</strong><span>${r.score} pts</span><span>${fmt(r.used)}</span></div>`).join(''):`<p class="empty">Todavía no hay resultados guardados para esta configuración.</p>`}
function endView(){const s=getScore(),win=state.result==='won',used=state.total-state.secondsLeft;return `${hud()}<section class="result-hero ${win?'':'fail'}"><p class="eyebrow">PROTOCOLO ${win?'COMPLETADO':'INTERRUMPIDO'}</p><h1>${win?'🚪 ¡Escaparon del laboratorio!':'⏳ Tiempo agotado'}</h1><p>${win?'El sistema recuperó el control. El equipo descifró cada código y defendió sus respuestas.':'El laboratorio se reinició antes de que abrieran todas las puertas. Revisen los conceptos y vuelvan a intentarlo.'}</p></section><div class="score-grid"><div class="score-tile"><small>PUNTUACIÓN FINAL</small><strong>${s.total}</strong></div><div class="score-tile"><small>SALAS DESBLOQUEADAS</small><strong>${state.completed.length}/${state.route.length}</strong></div><div class="score-tile"><small>TIEMPO EMPLEADO</small><strong>${fmt(used)}</strong></div><div class="score-tile"><small>PISTAS / INTENTOS FALLIDOS</small><strong>${s.hints} / ${s.wrong}</strong></div></div><div class="setup-grid"><section class="panel"><h3>Desglose del puntaje</h3><table class="score-table"><tr><td>Salas abiertas (${state.completed.length} × 10)</td><td>+${s.unlocked}</td></tr><tr><td>Preguntas correctas (${s.correct/2} × 2)</td><td>+${s.correct}</td></tr><tr><td>Pistas utilizadas (${s.hints} × −2)</td><td>−${s.hints*2}</td></tr><tr><td>Intentos fallidos desde el tercero</td><td>−${s.penalty}</td></tr><tr><td>Minutos completos sobrantes (si escaparon)</td><td>+${s.bonus}</td></tr><tr><td><b>Total</b></td><td>${s.total}</td></tr></table><p class="panel-sub">${s.explained} explicaciones justificadas oralmente y registradas por el equipo.</p><h3>Acta de la partida</h3><pre class="summary" id="summary">${esc(summaryText())}</pre><div class="btnrow" style="margin-top:15px"><button class="ghost" data-act="copy">Copiar acta</button><button class="ghost" data-act="export">↓ Exportar CSV</button><button class="primary" data-act="again">Nueva partida ↗</button></div></section><aside class="side-stack"><section class="panel"><h3>🏆 Clasificación local</h3><p class="panel-sub">Solo se comparan equipos con la misma duración y dificultad. Los datos se guardan únicamente en este navegador cuando el almacenamiento está disponible.</p><div class="leader-board">${ranking()}</div></section><section class="panel"><h3>¿Qué mejoraría su equipo?</h3><p class="panel-sub">Registren si el tiempo fue suficiente, cuáles preguntas causaron discusión y qué mejorarían. Para la entrega académica, prueben el juego también con alguien que no haya participado en su diseño.</p><button class="ghost" data-act="tests">↓ Plantilla de pruebas</button></section></aside></div>`}
function render(){const el=$('app');if(!state)el.innerHTML=intro();else if(state.phase==='room')el.innerHTML=roomView();else if(state.phase==='review')el.innerHTML=reviewView();else el.innerHTML=endView();window.scrollTo({top:0,behavior:'instant'});if(state&&state.phase==='room')playTick()}
function unlock(){const r=currentRoom();if(answeredCount(r)!==r.questions.length)return;
 const answer=r.questions.map(x=>state.answers[x.id]).join(''),expected=r.questions.map(x=>x.correct).join('');
 if(answer===expected){state.completed.push(r.index);state.phase='review';state.shownMessage='';state.messageKind='';if(state.completed.length===state.route.length){state.secondsLeft=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));state.result='won';clearInterval(timer);finishGame()}render();return}
 state.fails[r.index]=(state.fails[r.index]||0)+1;
 state.shownMessage='ACCESO DENEGADO. El código no coincide. '+(state.fails[r.index]>=3?'Se descuenta 1 punto desde este intento.':'La penalización comienza en el tercer intento fallido.');state.messageKind='error';
 const mes=$('app');if(mes)mes.innerHTML=roomView();playTick();
}
function finishGame(){if(!state||state.registered)return;state.registered=true;const sc=getScore(),d=loadData();d.results=[...(Array.isArray(d.results)?d.results:[]),{id:state.session,date:new Date().toISOString(),team:state.team,mode:state.mode,level:state.level,players:state.players,result:state.result,score:sc.total,used:state.total-state.secondsLeft,hints:sc.hints,errors:sc.wrong}].slice(-60);saveData(d)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function download(name,body,type='text/csv;charset=utf-8'){const blob=new Blob([type.startsWith('text/csv')?'\uFEFF':'',body],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function downloadBank(){const heads=['ID','Sala','Eje','Nivel','Tipo','Ficha','Término','Pregunta','Opción 1','Opción 2','Opción 3','Opción 4','Respuesta correcta','Criterio'];const rows=BANK.map(q=>[q.id,ROOMS[q.room].name,EJE_NAMES[q.eje-1],LEVELS[q.lv],TYPES[q.type],q.ficha,q.term,q.q,...q.opts,q.ok+1,q.why]);download('Codigo_IA_Banco_Completo.csv',[heads,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n'))}
function downloadRules(){const text=`CÓDIGO IA — REGLAMENTO\n\nNombre: Código IA — Escape del laboratorio.\nObjetivo: Demostrar comprensión de conceptos de inteligencia artificial, aplicarlos a situaciones reales o hipotéticas y escapar del laboratorio.\nPúblico: Estudiantes de Inteligencia Artificial I y público que aprende IA.\nMateriales: Navegador web, dispositivo con teclado/ratón o pantalla táctil, glosario académico opcional. No requiere Internet ni instalación.\nJugadores: 1 a 6 por equipo; equipos distintos pueden jugar por turnos en un dispositivo, o cada equipo en el suyo.\nPreparación: Elegir nombre de equipo, número de integrantes, dificultad (básico, intermedio, avanzado o progresivo) y duración.\nDuraciones: Corta (12 min, 2 salas, 6 retos); mediana (25 min, 3 salas, 12 retos); larga (50 min, 5 salas, 25 retos).\nTurnos: Cada jugador lee una pregunta por turno (se indica en pantalla); el equipo discute y elige consensuadamente una opción. Se puede volver sobre las preguntas antes de validar el código.\nDinámica: Cuatro opciones por reto. Los números marcados forman la clave de la puerta. Una sala se abre solo al acertar el código completo.\nAyudas: Una pista por sala que remite a una ficha del glosario, con costo de 2 puntos.\nPuntuación: +10 por sala, +2 por pregunta al desbloquear, -2 por pista, -1 por cada intento fallido a partir del tercero en cada sala. Al ganar, +1 por minuto completo restante.\nCondición de victoria: Abrir todas las salas del recorrido antes de que el reloj llegue a cero. Si se agota el tiempo, pierde el equipo.\nEmpates entre equipos del mismo modo y nivel: más puntos, luego menor tiempo empleado, luego menos pistas, luego menos errores; si persiste la igualdad, empate compartido.\nCorrección: Se valida el código automáticamente; al abrir la sala se muestran respuestas correctas y explicaciones. La explicación oral se registra aparte sin dar puntos.\nModalidades de retos: definición inversa, relacionar conceptos, decisión de caso, detectar error y resolver cálculo. Niveles básicos, intermedios y avanzados.\nPruebas: Registrar al menos una partida con participantes externos al equipo autor, detectar dificultades y documentar ajustes.\n`;download('Reglamento_Codigo_IA.txt',text,'text/plain;charset=utf-8')}
function downloadTests(){const rows=[['Fecha','Equipo/participantes','Jugadores','Modalidad','Nivel','Resultado','Tiempo usado','Puntaje','Dificultades detectadas','Accesibilidad','Cambios propuestos','Responsable']];download('Plantilla_Registro_Pruebas.csv',rows.map(r=>r.map(csvCell).join(';')).join('\r\n'))}
function exportSummary(){const x=getScore();const lines=[['Campo','Valor'],['Equipo',state.team],['Jugadores',state.players],['Modo',MODES[state.mode].label],['Dificultad',LEVELS[state.level]],['Resultado',state.result],['Salas abiertas',state.completed.length],['Puntos',x.total],['Intentos fallidos',x.wrong],['Pistas',x.hints],['Explicaciones justificadas',x.explained],['Tiempo empleado (segundos)',state.total-state.secondsLeft],['Identificador',state.session]];download('Resultado_Codigo_IA_'+state.session+'.csv',lines.map(r=>r.map(csvCell).join(';')).join('\r\n'))}
function copyResult(el){const str=summaryText();const success=()=>{el.textContent='✓ Acta copiada'};if(navigator.clipboard?.writeText){navigator.clipboard.writeText(str).then(success,()=>{const x=$('summary');const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(x);selection.removeAllRanges();selection.addRange(range);el.textContent='Seleccionado: pulsa Ctrl+C'})}else{const x=$('summary');const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(x);selection.removeAllRanges();selection.addRange(range);el.textContent='Seleccionado: pulsa Ctrl+C'}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-choice],[data-act]');if(!el)return;
 if(el.dataset.choice){selected(el);prefs[el.dataset.choice==='mode'?'mode':'level']=el.dataset.value;return}
 const act=el.dataset.act;
 if(act==='start'){prefs.team=$('team').value;prefs.players=+$('players').value;newGame()}
 else if(act==='bank')downloadBank();else if(act==='rules')downloadRules();else if(act==='tests')downloadTests();
 else if(act==='restart'){if(!abortConfirm){abortConfirm=true;el.textContent='CONFIRMAR SALIDA';return}clearInterval(timer);abortConfirm=false;state=null;render()}
 else if(act==='answer'){state.answers[el.dataset.q]=+el.dataset.n;state.shownMessage='';state.messageKind='';state.hintShown=!!(state.hints[currentRoom().index]===currentRoom().questions[state.qPos].id);$('app').innerHTML=roomView();playTick()}
 else if(act==='prev'){state.qPos=Math.max(0,state.qPos-1);state.shownMessage='';state.hintShown=!!(state.hints[currentRoom().index]===currentRoom().questions[state.qPos].id);render()}
 else if(act==='nextq'){state.qPos=Math.min(currentRoom().questions.length-1,state.qPos+1);state.shownMessage='';state.hintShown=!!(state.hints[currentRoom().index]===currentRoom().questions[state.qPos].id);render()}
 else if(act==='jump'){state.qPos=+el.dataset.i;state.hintShown=!!(state.hints[currentRoom().index]===currentRoom().questions[state.qPos].id);state.shownMessage='';render()}
 else if(act==='hint'){const r=currentRoom();if(state.hints[r.index])return;state.hints[r.index]=r.questions[state.qPos].id;state.hintShown=true;$('app').innerHTML=roomView();playTick()}
 else if(act==='unlock')unlock();
 else if(act==='advance'){if(state.roomPos===state.route.length-1){state.phase='end'}else{state.roomPos++;state.qPos=0;state.phase='room';state.shownMessage='';state.messageKind='';state.hintShown=false}render()}
 else if(act==='again'){clearInterval(timer);state=null;render()}
 else if(act==='copy')copyResult(el);else if(act==='export')exportSummary();
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-act="justify"]');if(el&&state)state.explained[el.dataset.id]=el.checked});
render();
</script>
</body>
</html>
